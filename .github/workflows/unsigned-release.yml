name: Direct-download release
# vX.Y.Z-alpha.N: tester prerelease. vX.Y.Z-beta.N, -rc.N and vX.Y.Z: public
# releases shown as Latest. Public Linux downloads must carry a GPG signature.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev patchelf ffmpeg libfuse2t64
      - name: macOS fixture tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows fixture tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc make tar
      - run: npm ci
      - run: node scripts/verify-glib-patch.mjs
      - run: npm test
      - run: npm run build
      - name: Build audited media (Unix)
        if: runner.os != 'Windows'
        run: npm run media:build && npm run release:check
      - name: Build audited media (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/media-build.mjs && node scripts/release.mjs check
      - name: Verify native fixtures (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SOUNDSHELF_FFMPEG="$(command -v ffmpeg)"
          export SOUNDSHELF_FFPROBE="$(command -v ffprobe)"
          cargo test --workspace --locked -- --include-ignored
      - name: Verify native fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $generator = Get-ChildItem -LiteralPath "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $generator) { throw 'Fixture FFmpeg missing' }
          $env:SOUNDSHELF_FFMPEG = $generator.FullName
          $env:SOUNDSHELF_FFPROBE = Join-Path $generator.DirectoryName 'ffprobe.exe'
          cargo test --workspace --locked -- --include-ignored
      - name: Build direct-download installer
        run: node scripts/unsigned-release.mjs build
      - name: Inspect actual installer contents and collect hashes
        run: node scripts/collect-unsigned-release.mjs
      - name: Sign Linux downloads
        if: runner.os == 'Linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-alpha.') }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            if [ "$SIGNING_REQUIRED" = true ]; then echo '::error::LINUX_GPG_PRIVATE_KEY is required for beta and stable releases (docs/RELEASE.md)'; exit 1; fi
            echo 'No Linux signing key provisioned; this tester build stays unsigned.'; exit 0
          fi
          test -f release/linux-release-key.asc || { echo '::error::Publish release/linux-release-key.asc before signing'; exit 1; }
          LINUX_SIGNING_FINGERPRINT="$(gpg --batch --show-keys --with-colons release/linux-release-key.asc | awk -F: '$1=="fpr"{print $10; exit}')"
          export LINUX_SIGNING_FINGERPRINT
          printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          node scripts/sign-linux-release.mjs unsigned-release
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.os }}
          path: unsigned-release/*
          if-no-files-found: error
      - name: Retain corresponding FFmpeg source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: corresponding-media-source
          path: .release-input/ffmpeg-source/ffmpeg-9.0.2.tar.xz
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true
      - name: Verify retained checksums
        working-directory: release-downloads
        run: |
          for checksum in SHA256SUMS-*.txt; do sha256sum -c "$checksum"; done
          sha256sum ffmpeg-9.0.2.tar.xz > SHA256SUMS-media-source.txt
      - name: Verify Linux signatures against the published key
        if: ${{ !contains(github.ref_name, '-alpha.') }}
        working-directory: release-downloads
        run: |
          gpg --batch --import ../release/linux-release-key.asc
          fingerprint="$(gpg --batch --show-keys --with-colons ../release/linux-release-key.asc | awk -F: '$1=="fpr"{print $10; exit}')"
          for file in *.AppImage *.deb SHA256SUMS-x86_64-unknown-linux-gnu.txt; do
            gpg --batch --status-fd 1 --verify "$file.asc" "$file" | grep -q "^\[GNUPG:\] VALIDSIG $fingerprint " || { echo "::error::$file is not signed by the published Linux release key"; exit 1; }
          done
          cp ../release/linux-release-key.asc creativeshelf-linux-release-key.asc
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-alpha.*) kind=--prerelease; title="CreativeShelf $RELEASE_TAG — unsigned tester preview"; notes=docs/UNSIGNED_TESTER_RELEASE.md ;;
            *-beta.*) kind=--latest; title="CreativeShelf $RELEASE_TAG — public beta"; notes=docs/RELEASE_NOTES.md ;;
            *-rc.*) kind=--latest; title="CreativeShelf $RELEASE_TAG — release candidate"; notes=docs/RELEASE_NOTES.md ;;
            *) kind=--latest; title="CreativeShelf $RELEASE_TAG"; notes=docs/RELEASE_NOTES.md ;;
          esac
          extra=(); [ "$kind" = --latest ] && extra=(--generate-notes)
          gh release create "$RELEASE_TAG" release-downloads/* --verify-tag "$kind" --title "$title" --notes-file "$notes" "${extra[@]}"
