name: Unsigned tester release
on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev patchelf ffmpeg libfuse2t64
      - name: macOS fixture tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows fixture tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc make tar
      - run: npm ci
      - run: node scripts/verify-glib-patch.mjs
      - run: npm test
      - run: npm run build
      - name: Build audited media (Unix)
        if: runner.os != 'Windows'
        run: npm run media:build && npm run release:check
      - name: Build audited media (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/media-build.mjs && node scripts/release.mjs check
      - name: Verify native fixtures (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SOUNDSHELF_FFMPEG="$(command -v ffmpeg)"
          export SOUNDSHELF_FFPROBE="$(command -v ffprobe)"
          cargo test --workspace --locked -- --include-ignored
      - name: Verify native fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $generator = Get-ChildItem -LiteralPath "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $generator) { throw 'Fixture FFmpeg missing' }
          $env:SOUNDSHELF_FFMPEG = $generator.FullName
          $env:SOUNDSHELF_FFPROBE = Join-Path $generator.DirectoryName 'ffprobe.exe'
          cargo test --workspace --locked -- --include-ignored
      - name: Build unsigned tester installer
        run: node scripts/unsigned-release.mjs build
      - name: Inspect actual installer contents and collect hashes
        run: node scripts/collect-unsigned-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.os }}
          path: unsigned-release/*
          if-no-files-found: error
      - name: Retain corresponding FFmpeg source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: corresponding-media-source
          path: .release-input/ffmpeg-source/ffmpeg-9.0.2.tar.xz
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true
      - name: Verify retained checksums
        working-directory: release-downloads
        run: |
          for checksum in SHA256SUMS-*.txt; do sha256sum -c "$checksum"; done
          sha256sum ffmpeg-9.0.2.tar.xz > SHA256SUMS-media-source.txt
      - name: Publish explicitly unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-downloads/* --verify-tag --prerelease --title "CreativeShelf $RELEASE_TAG — unsigned tester preview" --notes-file docs/UNSIGNED_TESTER_RELEASE.md
