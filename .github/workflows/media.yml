name: Minimal media qualification
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: media-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  packaged-media:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux compiler and fixture tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev ffmpeg
      - name: macOS fixture tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows fixture tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc make tar
      - run: npm ci
      - name: Build verified audio-only media (Unix)
        if: runner.os != 'Windows'
        run: npm run media:build && npm run release:check
      - name: Build verified audio-only media (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/media-build.mjs && node scripts/release.mjs check
      - name: Exercise exact packaged tools (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SOUNDSHELF_FFMPEG="$(command -v ffmpeg)"
          export SOUNDSHELF_FFPROBE="$(command -v ffprobe)"
          export CREATIVESHELF_PACKAGED_FFMPEG="$PWD/.release-input/$(rustc -vV | sed -n 's/^host: //p')/ffmpeg"
          export CREATIVESHELF_PACKAGED_FFPROBE="$PWD/.release-input/$(rustc -vV | sed -n 's/^host: //p')/ffprobe"
          cargo test -p soundshelf-core --features packaged-media-qualification --test packaged_media --locked
      - name: Exercise exact packaged tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mediaTools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $generator = Get-ChildItem -LiteralPath $mediaTools -Filter ffmpeg.exe -Recurse -File -ErrorAction Stop | Select-Object -First 1
          if (-not $generator) { throw 'Fixture generator unavailable' }
          $env:SOUNDSHELF_FFMPEG = $generator.FullName
          $env:SOUNDSHELF_FFPROBE = Join-Path $generator.DirectoryName 'ffprobe.exe'
          $env:CREATIVESHELF_PACKAGED_FFMPEG = Join-Path $pwd '.release-input\x86_64-pc-windows-msvc\ffmpeg.exe'
          $env:CREATIVESHELF_PACKAGED_FFPROBE = Join-Path $pwd '.release-input\x86_64-pc-windows-msvc\ffprobe.exe'
          cargo test -p soundshelf-core --features packaged-media-qualification --test packaged_media --locked
      - name: Retain exact minimal runtime and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: minimal-media-${{ matrix.os }}
          path: |
            .release-input/media-lock.json
            .release-input/aarch64-apple-darwin/ffmpeg
            .release-input/aarch64-apple-darwin/ffprobe
            .release-input/aarch64-apple-darwin/FFMPEG.txt
            .release-input/x86_64-apple-darwin/ffmpeg
            .release-input/x86_64-apple-darwin/ffprobe
            .release-input/x86_64-apple-darwin/FFMPEG.txt
            .release-input/x86_64-pc-windows-msvc/ffmpeg.exe
            .release-input/x86_64-pc-windows-msvc/ffprobe.exe
            .release-input/x86_64-pc-windows-msvc/FFMPEG.txt
            .release-input/x86_64-unknown-linux-gnu/ffmpeg
            .release-input/x86_64-unknown-linux-gnu/ffprobe
            .release-input/x86_64-unknown-linux-gnu/FFMPEG.txt
            .release-input/ffmpeg-source/ffmpeg-9.0.2.tar.xz
          include-hidden-files: true
