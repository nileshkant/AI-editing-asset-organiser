name: Signed candidate preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-candidate
  cancel-in-progress: false
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux package prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev patchelf
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc make tar
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify and build minimal target media (Unix)
        if: runner.os != 'Windows'
        run: npm run media:build && npm run release:check
      - name: Verify and build minimal target media (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/media-build.mjs && node scripts/release.mjs check
      # Certificate/key provisioning into the runner must be configured privately
      # before dispatch. Missing native signing identities fail closed.
      - name: Build signed candidate
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          LINUX_SIGNING_FINGERPRINT: ${{ secrets.LINUX_SIGNING_FINGERPRINT }}
        run: npm run desktop:bundle
      # No upload/publication before artifact inspection and SS-031 release review.
