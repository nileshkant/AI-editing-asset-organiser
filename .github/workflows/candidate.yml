name: Signed candidate preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: macos-14
    environment: release-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      # This job intentionally stops here until reviewed static media inputs and
      # Apple certificate provisioning exist. Never substitute Homebrew binaries.
      - name: Require audited target media
        run: npm run release:check
      - name: Build signed notarized candidate
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npm run desktop:bundle
      # No upload/release publication before artifact inspection and SS-031 approval.
