name: Verify
on: [pull_request]
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev patchelf ffmpeg
      - name: macOS media fixture tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media fixture tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-fixture-ffmpeg.ps1
      - run: npm ci
      - name: Verify GTK backport source integrity
        run: node scripts/verify-glib-patch.mjs
      - run: npm test
      - run: npm run build
      - name: Rust and real media fixtures (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export SOUNDSHELF_FFMPEG="$(command -v ffmpeg)"
          export SOUNDSHELF_FFPROBE="$(command -v ffprobe)"
          cargo test --workspace --locked -- --include-ignored
      - name: Rust and real media fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Real binaries resolved by scripts/windows-fixture-ffmpeg.ps1, never Chocolatey shims.
          $env:SOUNDSHELF_FFMPEG = Join-Path $env:FIXTURE_FFMPEG_DIR 'ffmpeg.exe'
          $env:SOUNDSHELF_FFPROBE = Join-Path $env:FIXTURE_FFMPEG_DIR 'ffprobe.exe'
          cargo test --workspace --locked -- --include-ignored
      - name: Gated native image import and preview lifecycle
        run: cargo test -p soundshelf --features image-development --locked image_
      - name: Optimized GTK out-pointer regression (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p soundshelf --release --locked gtk_variant -- --nocapture
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify GTK backport before registry audit
        run: node scripts/verify-glib-patch.mjs
      - name: Audit JavaScript lock
        run: npm audit --json > npm-advisory-report.json
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust lock
        run: cargo audit --json > rust-advisory-report.json
      - name: Retain advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-reports
          path: '*-advisory-report.json'
  browser-accessibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - name: Retain browser accessibility and keyboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility
          path: |
            playwright-report/
            test-results/
