name: Verify
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev patchelf ffmpeg
      - name: macOS media fixture tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media fixture tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust and real media fixtures
        shell: bash
        run: |
          export SOUNDSHELF_FFMPEG="$(command -v ffmpeg)"
          export SOUNDSHELF_FFPROBE="$(command -v ffprobe)"
          cargo test --workspace --locked -- --include-ignored
