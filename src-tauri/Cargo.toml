[package]
name = "soundshelf"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
soundshelf-core = { path = "../crates/core" }
tauri-plugin-dialog = "2"
# SS-047 opt-in folder watching: FSEvents, inotify, ReadDirectoryChangesW.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
uuid = { version = "1", features = ["v4"] }

soundshelf-agent = { path = "../crates/agent" }

# SS-049: provider API keys live in the OS credential store, never in SQLite.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[features]
# Disposable internal image flows only until SS-048 mixed persistence ships.
image-development = []
