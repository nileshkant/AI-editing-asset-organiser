[workspace]
members = ["src-tauri", "crates/core", "crates/agent"]
resolver = "2"

[patch.crates-io]
# macOS 26 can raise an Objective-C exception while tao is still inside
# applicationDidFinishLaunching. Keep the compatibility fix local until tao
# ships the deferred initial-event change upstream.
tao = { path = "vendor/tao" }
# RUSTSEC-2024-0429: upstream two-line mutable out-pointer fix, kept on GTK3 ABI.
glib = { path = "vendor/glib" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
