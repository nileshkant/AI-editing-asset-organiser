[package]
name = "soundshelf-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
thiserror = "2"
regex = "1"
strsim = "0.11"
walkdir = "2"
libc = "0.2"
cpal = "0.18"
rtrb = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
moxcms = { version = "=0.9.1", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.2"
unicode-normalization = "=0.1.26"

[dev-dependencies]
tempfile = "3"
png = "=0.18.1"

[features]
# Compiles an explicit narrow-binary integration fixture only in the media build job.
packaged-media-qualification = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
