[package]
name = "soundshelf-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
